<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toathmor - Font Tester Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Khmer+OS+Battambang&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-body: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --border-color: #e2e8f0;
            --textarea-bg: #ffffff;
            --textarea-text: #1e293b;
        }

        [data-theme="dark"] {
            --bg-body: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --bg-card: rgba(30, 41, 59, 0.9);
            --text-main: #f8fafc;
            --border-color: #334155;
            --textarea-bg: #1e293b;
            --textarea-text: #f8fafc;
        }

        body {
            font-family: 'Kantumruy Pro', 'Khmer OS Battambang', system-ui, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--border-color);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 600;
            font-family: inherit;
            transition: 0.3s;
        }

        .upload-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: 0.3s ease;
        }

        #fontFile { display: none; }

        .font-info {
            font-size: 14px;
            color: #10b981;
            text-align: center;
            margin-bottom: 20px;
            background: rgba(16, 185, 129, 0.1);
            padding: 8px;
            border-radius: 30px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.02);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }

        .control-group label { font-size: 14px; font-weight: 600; }
        .color-pickers { display: flex; gap: 10px; }
        .color-box { display: flex; align-items: center; gap: 5px; font-size: 12px; }

        .palette-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
        .palette-btn {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ffffff;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: transform 0.2s;
            position: relative; overflow: hidden;
        }
        .palette-btn:hover { transform: scale(1.15); }
        .palette-btn::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: var(--p-text); }
        .palette-btn::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: var(--p-bg); }

        .text-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; flex-wrap: wrap; gap: 10px;
        }

        .sample-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .sample-btn {
            background: rgba(102, 126, 234, 0.1); color: #667eea; border: 1px solid rgba(102, 126, 234, 0.2);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; transition: 0.2s;
        }
        .sample-btn:hover { background: #667eea; color: #ffffff; }

        .clear-btn {
            background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; transition: 0.2s;
        }
        .clear-btn:hover { background: #ef4444; color: #ffffff; }

        .preview-wrapper {
            background: var(--textarea-bg);
            border-radius: 16px;
            border: 2px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 20px;
            font-size: 32px;
            font-family: 'Kantumruy Pro', 'Khmer OS Battambang', sans-serif;
            color: var(--textarea-text);
            background: transparent;
            border: none;
            resize: none;
            box-sizing: border-box;
            outline: none;
            line-height: 1.7;
        }

        .action-bar { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn {
            flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 12px;
            cursor: pointer; font-weight: 600; font-family: inherit; display: flex;
            align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
            background: var(--border-color); color: var(--text-main);
        }
        .action-btn.primary { background: #3b82f6; color: white; }
        .action-btn:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="brand-name">តារាងតេស្ដពុម្ពអក្សរ</div>
      <p> (Y)
        <button class="theme-toggle" id="themeBtn">🌙 Dark Mode</button>
        
    </div>
    
    <div class="upload-section" onclick="document.getElementById('fontFile').click()">
        <p>📤 ចុចបញ្ចូលពុម្ពអក្សរ (.ttf, .otf, .woff)</p>
        <input type="file" id="fontFile" accept=".ttf, .otf, .woff, .woff2">
    </div>

    <div class="font-info" id="fontInfo">មិនទាន់មានពុម្ពអក្សរផ្ទាល់ខ្លួនត្រូវបានបញ្ចូលទេ</div>

    <div class="controls-grid">
        <div class="control-group">
            <label>ទំហំអក្សរ: <span id="sizeVal">32px</span></label>
            <input type="range" id="fontSize" min="16" max="100" value="32">
        </div>
        <div class="control-group">
            <label>គម្លាតបន្ទាត់: <span id="lineVal">1.7</span></label>
            <input type="range" id="lineSpacing" min="1" max="3" step="0.1" value="1.7">
        </div>
        <div class="control-group" style="display:none;">
            <input type="range" id="letterSpacing" min="0" max="0" value="0">
        </div>
        <div class="control-group">
            <label>កំណត់ពណ៌ / ពណ៌រហ័ស</label>
            <div class="color-pickers">
                <div class="color-box"><input type="color" id="textColor" value="#1e293b"> អក្សរ</div>
                <div class="color-box"><input type="color" id="bgColor" value="#ffffff"> ផ្ទៃក្រោយ</div>
            </div>
            <div class="palette-container">
                <div class="palette-btn" style="--p-text: #1e293b; --p-bg: #ffffff;" onclick="setQuickColor('#1e293b', '#ffffff')"></div>
                <div class="palette-btn" style="--p-text: #ffffff; --p-bg: #1e293b;" onclick="setQuickColor('#ffffff', '#1e293b')"></div>
                <div class="palette-btn" style="--p-text: #facc15; --p-bg: #1e3a8a;" onclick="setQuickColor('#facc15', '#1e3a8a')"></div>
                <div class="palette-btn" style="--p-text: #ffffff; --p-bg: #15803d;" onclick="setQuickColor('#ffffff', '#15803d')"></div>
                <div class="palette-btn" style="--p-text: #ffffff; --p-bg: #b91c1c;" onclick="setQuickColor('#ffffff', '#b91c1c')"></div>
                <div class="palette-btn" style="--p-text: #2563eb; --p-bg: #fef08a;" onclick="setQuickColor('#2563eb', '#fef08a')"></div>
            </div>
        </div>
    </div>

    <div class="text-actions">
        <div class="sample-buttons">
            <span style="font-size: 13px; font-weight: bold; align-self: center;">គំរូអត្ថបទ៖</span>
            <button class="sample-btn" onclick="insertSample('abc')">កខគ</button>
            <button class="sample-btn" onclick="insertSample('proverb')">សុភាសិត</button>
            <button class="sample-btn" onclick="insertSample('poem')">កំណាព្យ</button>
        </div>
        <button class="clear-btn" id="clearBtn">🧹 សម្អាតអត្ថបទ</button>
    </div>

    <div class="preview-wrapper" id="previewWrapper">
        <textarea id="textPreview" placeholder="សូមវាយអក្សរខ្មែរនៅទីនេះ ដើម្បីតេស្តមើល...">អនិច្ចាតោថ្មលោកកសាង 
មើលថាថាងយ៉ាងរស់ស្ទុះប្រែប្រាយ
ឥឡូវមកធ្លាយធ្លាក់បាក់ខ្ចាត់ខ្ចាយ
ស្ដាយអើយស្ដាយមិនគួរមកពិការ។</textarea>
    </div>

    <div class="action-bar">
        <button class="action-btn primary" id="saveImgBtn">🖼️ រក្សាទុករូបភាព</button>
        <button class="action-btn" id="savePdfBtn">📄 ទាញយកជា PDF</button>
        <button class="action-btn" id="shareBtn">🔗 ចែករំលែក (Share)</button>
    </div>
</div>

<script>
    const fontFileInput = document.getElementById('fontFile');
    const fontInfo = document.getElementById('fontInfo');
    const textPreview = document.getElementById('textPreview');
    const previewWrapper = document.getElementById('previewWrapper');
    const clearBtn = document.getElementById('clearBtn');
    
    const fontSize = document.getElementById('fontSize');
    const lineSpacing = document.getElementById('lineSpacing');
    const textColor = document.getElementById('textColor');
    const bgColor = document.getElementById('bgColor');

    const sizeVal = document.getElementById('sizeVal');
    const lineVal = document.getElementById('lineVal');

    let activeFontName = "'Kantumruy Pro', 'Khmer OS Battambang', sans-serif";

    const samples = {
        abc: "ក ខ គ ឃ ង ច ឆ ជ ឈ ញ ដ ឋ ឌ ឍ ណ ត ថ ទ ធ ន ប ផ ព ភ ម យ រ ល វ ស ហ ឡ អ\n",
        proverb: "នគរថ្កើប្លែក សប្បាយតែភ្នែក ក្នុងចិត្តរងកម្ម...។\nតស៊ូគង់បានសម្រេច វិជ្ជាប្ដូរផ្ដាច់ដោយការសន្សំ។",
        poem: "អនិច្ចាតោថ្មលោកកសាង\nមើលថាថាងយ៉ាងរស់ស្ទុះប្រែប្រាយ\nឥឡូវមកធ្លាយធ្លាក់បាក់ខ្ចាត់ខ្ចាយ\nស្ដាយអើយស្ដាយមិនគួរមកពិការ។"
    };

    function insertSample(type) { textPreview.value = samples[type]; }
    clearBtn.addEventListener('click', () => { textPreview.value = ''; textPreview.focus(); });

    fontSize.addEventListener('input', (e) => { textPreview.style.fontSize = e.target.value + 'px'; sizeVal.textContent = e.target.value + 'px'; });
    lineSpacing.addEventListener('input', (e) => { textPreview.style.lineHeight = e.target.value; lineVal.textContent = e.target.value; });

    textColor.addEventListener('input', (e) => { textPreview.style.color = e.target.value; });
    bgColor.addEventListener('input', (e) => { updateBackground(e.target.value); });

    function setQuickColor(txtColor, backColor) {
        textColor.value = txtColor; bgColor.value = backColor;
        textPreview.style.color = txtColor; updateBackground(backColor);
    }

    function updateBackground(color) {
        textPreview.style.backgroundColor = color;
        previewWrapper.style.backgroundColor = color;
    }

    fontFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const fontName = 'CustomFont_' + Date.now(); 
            const reader = new FileReader();
            reader.onload = function(event) {
                const fontUrl = event.target.result;
                const customFont = new FontFace(fontName, `url(${fontUrl})`);
                customFont.load().then(function(loadedFont) {
                    document.fonts.add(loadedFont);
                    activeFontName = fontName;
                    textPreview.style.fontFamily = fontName;
                    fontInfo.style.color = '#10b981';
                    fontInfo.textContent = `បានភ្ជាប់ពុម្ពអក្សរ៖ "${file.name}" រួចរាល់!`;
                }).catch(function(error) {
                    fontInfo.style.color = '#ef4444';
                    fontInfo.textContent = 'មិនអាចដំណើរការហ្វាយ Font នេះបានទេ!';
                });
            };
            reader.readAsDataURL(file);
        }
    });

    // 🚀 ប្រព័ន្ធគូរអក្សរផ្ទាល់លើ Canvas ធានាការរក្សាទុករូបភាពបានស្អាត ១០០% មិនរត់អក្សរ
    function drawTextToCanvas(callback) {
        document.fonts.ready.then(() => {
            const text = textPreview.value;
            const lines = text.split('\n');
            
            const currentFontSize = parseInt(fontSize.value);
            const currentLineHeight = parseFloat(lineSpacing.value);
            const currentTextColor = textColor.value;
            const currentBgColor = bgColor.value;

            // បង្កើតទំហំដង់ស៊ីតេរូបភាពកម្រិតច្បាស់ (Retina / HD Display)
            const baseWidth = 800;
            const baseHeight = Math.max(350, (lines.length * currentFontSize * currentLineHeight) + 100);
            const scale = 3; // គុណភាពច្បាស់ជាងមុន 3 ដង

            const canvas = document.createElement('canvas');
            canvas.width = baseWidth * scale;
            canvas.height = baseHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);

            // ចាក់ពណ៌ផ្ទៃក្រោយ
            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, baseWidth, baseHeight);

            // កំណត់ Font ចេញពីប្រព័ន្ធលាក់របស់ Browser ផ្ទាល់
            ctx.textBaseline = "top";
            ctx.fillStyle = currentTextColor;
            ctx.font = `normal ${currentFontSize}px ${activeFontName}, 'Kantumruy Pro', sans-serif`;

            // គូរអក្សរខ្មែរម្តងមួយជួរៗដោយរក្សាទុកជើងយូនីកូដទាំងស្រុង
            let startY = 50;
            lines.forEach((line) => {
                ctx.fillText(line, 40, startY);
                startY += (currentFontSize * currentLineHeight);
            });

            // ផ្ញើរូបភាពដែលបានគូររួចទៅមុខងារទាញយក
            const pngUrl = canvas.toDataURL('image/png');
            callback(pngUrl);
        });
    }

    // ប៊ូតុងរក្សាទុករូបភាព PNG
    document.getElementById('saveImgBtn').addEventListener('click', () => {
        drawTextToCanvas((pngUrl) => {
            const link = document.createElement('a');
            link.download = 'toathmor-font-test.png';
            link.href = pngUrl;
            link.click();
        });
    });

    // ប៊ូតុងរក្សាទុកជា PDF
    document.getElementById('savePdfBtn').addEventListener('click', () => {
        drawTextToCanvas((pngUrl) => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('l', 'mm', 'a4');
            pdf.addImage(pngUrl, 'PNG', 10, 15, 277, 140);
            pdf.save('toathmor-font-test.pdf');
        });
    });

    // មុខងារ Dark Mode / Light Mode
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            themeBtn.textContent = '🌙 Dark Mode';
            setQuickColor('#1e293b', '#ffffff');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeBtn.textContent = '☀️ Light Mode';
            setQuickColor('#f8fafc', '#1e293b');
        }
    });

    // មុខងារ Share
    document.getElementById('shareBtn').addEventListener('click', async () => {
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Toathmor Font Tester',
                    text: 'ខ្ញុំកំពុងតេស្តពុម្ពអក្សរនៅលើកម្មវិធី Toathmor!',
                    url: window.location.href
                });
            } catch (err) { console.log('ការ Share ត្រូវបានបដិសេធ'); }
        } else {
            alert('Browser របស់អ្នកមិនទាន់គាំទ្រមុខងារ Share ផ្ទាល់ទេ!');
        }
    });
</script>

</body>
</html>
