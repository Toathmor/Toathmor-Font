<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>តារាងតេស្តពុម្ពអក្សរ - Font Tester Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;700&family=Khmer+OS+Battambang&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-body: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --border-color: #e2e8f0;
            --textarea-bg: #ffffff;
            --textarea-text: #1e293b;
            --primary-color: #4f46e5;
            --p-text-color: rgba(255, 255, 255, 0.9);
            --toolbar-bg: #f8fafc; /* ពណ៌របារបញ្ជាស្រាលលក្ខណៈ Light Mode */
        }

        [data-theme="dark"] {
            --bg-body: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --bg-card: rgba(30, 41, 59, 0.9);
            --text-main: #f8fafc;
            --border-color: #334155;
            --textarea-bg: #1e293b;
            --textarea-text: #f8fafc;
            --primary-color: #818cf8;
            --p-text-color: rgba(0, 0, 0, 0.85);
            --toolbar-bg: #1e293b; /* ពណ៌របារបញ្ជាស្រាលលក្ខណៈ Dark Mode */
        }

        body {
            font-family: 'Kantumruy Pro', 'Khmer OS Battambang', system-ui, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .title-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-name {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .sub-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(45deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: system-ui, sans-serif;
        }

        .toathmor-tag {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 1.5px;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .theme-toggle {
            background: var(--border-color);
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .theme-toggle:hover { transform: translateY(-1px); }

        .upload-section {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 18px;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.25);
            transition: 0.3s ease;
        }

        #fontFile { display: none; }

        .font-info {
            font-size: 14px;
            color: #10b981;
            text-align: center;
            margin-bottom: 20px;
            background: rgba(16, 185, 129, 0.1);
            padding: 8px;
            border-radius: 30px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.02);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }

        .control-group label { font-size: 14px; font-weight: 600; }
        .color-pickers { display: flex; gap: 10px; }
        .color-box { display: flex; align-items: center; gap: 5px; font-size: 12px; }

        .palette-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
        .palette-btn {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ffffff;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: transform 0.2s;
            position: relative; overflow: hidden;
        }
        .palette-btn:hover { transform: scale(1.15); }
        .palette-btn::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: var(--p-text); }
        .palette-btn::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: var(--p-bg); }

        .text-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; flex-wrap: wrap; gap: 10px;
        }

        .sample-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .sample-btn {
            background: rgba(79, 70, 229, 0.1); color: #4f46e5; border: 1px solid rgba(79, 70, 229, 0.2);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; transition: 0.2s;
        }
        .sample-btn:hover { background: #4f46e5; color: #ffffff; }

        .clear-btn {
            background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; transition: 0.2s;
        }
        .clear-btn:hover { background: #ef4444; color: #ffffff; }

        /* 🌟 កែសម្រួលផ្ទាំងទិន្នន័យ៖ របារបញ្ជាពណ៌ស្រាលដាច់ដោយឡែកពីផ្ទាំងអត្ថបទ */
        .preview-wrapper {
            background: transparent;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        /* របារបញ្ជារក្សាពណ៌ស្រាលជានិច្ច ទោះបីជាផ្ទៃខាងក្រោយអត្ថបទប្តូរក៏ដោយ */
        .align-toolbar {
            display: flex;
            background: var(--toolbar-bg);
            padding: 10px 16px;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            justify-content: flex-start;
            flex-shrink: 0;
            z-index: 10;
        }
        
        .align-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        .align-btn:hover {
            background: rgba(79, 70, 229, 0.08);
            color: var(--primary-color);
        }
        .align-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.2);
        }

        /* ផ្ទាំងសរសេរអត្ថបទ៖ ប្តូរពណ៌ផ្ទៃខាងក្រោយតាមចិត្តដោយមិនប៉ះពាល់របារខាងលើ */
        .editable-preview {
            width: 100%;
            min-height: 200px;
            height: auto;
            padding: 25px;
            font-size: 32px;
            font-family: 'Kantumruy Pro', 'Khmer OS Battambang', sans-serif;
            color: var(--textarea-text);
            background: var(--textarea-bg);
            border: none;
            box-sizing: border-box;
            outline: none;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
            transition: text-align 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .editable-preview:empty:before {
            content: attr(placeholder);
            color: #94a3b8;
            cursor: text;
        }

        .action-bar { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn {
            flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 12px;
            cursor: pointer; font-weight: 600; font-family: inherit; display: flex;
            align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
            background: var(--border-color); color: var(--text-main);
        }
        .action-btn.primary { background: #3b82f6; color: white; }
        .action-btn:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="title-area">
            <div class="brand-name">តារាងតេស្តពុម្ពអក្សរ</div>
            <div class="sub-title">Font Tester</div>
            <div class="toathmor-tag">(TOATHMOR)</div>
        </div>
        <button class="theme-toggle" id="themeBtn">🌙 Dark</button>
    </div>
    
    <div class="upload-section" onclick="document.getElementById('fontFile').click()">
        <p>📤 ចុចបញ្ចូលពុម្ពអក្សរ (.ttf, .otf, .woff)</p>
        <input type="file" id="fontFile" accept=".ttf, .otf, .woff, .woff2">
    </div>

    <div class="font-info" id="fontInfo">មិនទាន់មានពុម្ពអក្សរផ្ទាល់ខ្លួនត្រូវបានបញ្ចូលទេ</div>

    <div class="controls-grid">
        <div class="control-group">
            <label>ទំហំអក្សរ: <span id="sizeVal">32px</span></label>
            <input type="range" id="fontSize" min="16" max="100" value="32">
        </div>
        <div class="control-group">
            <label>គម្លាតបន្ទាត់: <span id="lineVal">1.7</span></label>
            <input type="range" id="lineSpacing" min="1" max="3" step="0.1" value="1.7">
        </div>
        <div class="control-group">
            <label>កំណត់ពណ៌ / ពណ៌រហ័ស</label>
            <div class="color-pickers">
                <div class="color-box"><input type="color" id="textColor" value="#1e293b"> អក្សរ</div>
                <div class="color-box"><input type="color" id="bgColor" value="#ffffff"> ផ្ទៃក្រោយ</div>
            </div>
            <div class="palette-container">
                <div class="palette-btn" style="--p-text: #1e293b; --p-bg: #ffffff;" onclick="setQuickColor('#1e293b', '#ffffff')"></div>
                <div class="palette-btn" style="--p-text: #ffffff; --p-bg: #1e293b;" onclick="setQuickColor('#ffffff', '#1e293b')"></div>
                <div class="palette-btn" style="--p-text: #facc15; --p-bg: #1e3a8a;" onclick="setQuickColor('#facc15', '#1e3a8a')"></div>
                <div class="palette-btn" style="--p-text: #ffffff; --p-bg: #15803d;" onclick="setQuickColor('#ffffff', '#15803d')"></div>
                <div class="palette-btn" style="--p-text: #ffffff; --p-bg: #b91c1c;" onclick="setQuickColor('#ffffff', '#b91c1c')"></div>
                <div class="palette-btn" style="--p-text: #2563eb; --p-bg: #fef08a;" onclick="setQuickColor('#2563eb', '#fef08a')"></div>
            </div>
        </div>
    </div>

    <div class="text-actions">
        <div class="sample-buttons">
            <span style="font-size: 13px; font-weight: bold; align-self: center;">គំរូអត្ថបទ៖</span>
            <button class="sample-btn" onclick="insertSample('abc')">ព្យញ្ជនៈ</button>
            <button class="sample-btn" onclick="insertSample('proverb')">សុភាសិត</button>
            <button class="sample-btn" onclick="insertSample('poem')">កំណាព្យ</button>
        </div>
        <button class="clear-btn" id="clearBtn">🧹 សម្អាតអត្ថបទ</button>
    </div>

    <div class="preview-wrapper">
        <div class="align-toolbar">
            <button class="align-btn active" id="alignLeft" onclick="setTextAlign('left')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>
                ឆ្វេង
            </button>
            <button class="align-btn" id="alignCenter" onclick="setTextAlign('center')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="10" x2="6" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="18" y1="18" x2="6" y2="18"></line></svg>
                កណ្តាល
            </button>
            <button class="align-btn" id="alignRight" onclick="setTextAlign('right')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="7" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="7" y2="18"></line></svg>
                ស្តាំ
            </button>
        </div>
        <div class="editable-preview" id="textPreview" contenteditable="true" placeholder="សូមវាយអក្សរខ្មែរនៅទីនេះ ដើម្បីតេស្តមើល...">អនិច្ចាតោថ្មលោកកសាង
មើលថាថាងយ៉ាងរស់ស្ទុះប្រែប្រាយ
ឥឡូវមកធ្លាយធ្លាក់បាក់ខ្ចាត់ខ្ចាយ
ស្តាយអើយស្តាយមិនគួរមកពិការ។</div>
    </div>

    <div class="action-bar">
        <button class="action-btn primary" id="saveImgBtn">🖼️ រក្សាទុករូបភាព</button>
        <button class="action-btn" id="savePdfBtn">📄 ទាញយកជា PDF</button>
        <button class="action-btn" id="shareBtn">🔗 ចែករំលែក (Share)</button>
    </div>
</div>

<script>
    const fontFileInput = document.getElementById('fontFile');
    const fontInfo = document.getElementById('fontInfo');
    const textPreview = document.getElementById('textPreview');
    const clearBtn = document.getElementById('clearBtn');
    
    const fontSize = document.getElementById('fontSize');
    const lineSpacing = document.getElementById('lineSpacing');
    const textColor = document.getElementById('textColor');
    const bgColor = document.getElementById('bgColor');

    const sizeVal = document.getElementById('sizeVal');
    const lineVal = document.getElementById('lineVal');

    let activeFontName = "'Kantumruy Pro', 'Khmer OS Battambang', sans-serif";
    let currentAlign = "left";

    const samples = {
        abc: "ក្ក ខ្ខ គ្គ ឃ្ឃ ង្ង ច្ច ឆ្ឆ ជ្ជ ឈ្ឈ ញ្ញ(ញ) ដ្ដ ឋ្ឋ ឌ្ឌ ឍ្ឍ ណ្ណ ត្ត ថ្ថ ទ្ទ ធ្ធ ប្ប ផ្ផ ព្ព ភ្ភ ម្ម យ្យ រ្រ ល្ល វ្វ ស្ស ហ្ហ ឡ អ្អ",
        proverb: "នគរថ្កើងប្លែក សប្បាយតែភ្នែក ក្នុងចិត្តរងកម្ម។\nវិជ្ជាជាទ្រព្យគាប់ចិន្តា។\nជីវិតគឺជាការតស៊ូ។",
        poem: "អនិច្ចាតោថ្មលោកកសាង\nមើលថាថាងយ៉ាងរស់ស្ទុះប្រែប្រាយ\nឥឡូវមកធ្លាយធ្លាក់បាក់ខ្ចាត់ខ្ចាយ      \nស្តាយអើយស្តាយមិនគួរមកពិការ។"
    };

    function insertSample(type) { textPreview.innerText = samples[type]; }
    clearBtn.addEventListener('click', () => { textPreview.innerText = ''; textPreview.focus(); });

    function setTextAlign(alignType) {
        currentAlign = alignType;
        textPreview.style.textAlign = alignType;
        
        document.querySelectorAll('.align-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`align${alignType.charAt(0).toUpperCase() + alignType.slice(1)}`).classList.add('active');
    }

    textPreview.addEventListener('paste', function(e) {
        e.preventDefault();
        const text = (e.originalEvent || e).clipboardData.getData('text/plain');
        document.execCommand('insertText', false, text);
    });

    fontSize.addEventListener('input', (e) => { 
        textPreview.style.fontSize = e.target.value + 'px'; 
        sizeVal.textContent = e.target.value + 'px'; 
    });
    lineSpacing.addEventListener('input', (e) => { 
        textPreview.style.lineHeight = e.target.value; 
        lineVal.textContent = e.target.value; 
    });

    textColor.addEventListener('input', (e) => { textPreview.style.color = e.target.value; });
    bgColor.addEventListener('input', (e) => { updateBackground(e.target.value); });

    function setQuickColor(txtColor, backColor) {
        textColor.value = txtColor; bgColor.value = backColor;
        textPreview.style.color = txtColor; updateBackground(backColor);
    }

    function updateBackground(color) {
        textPreview.style.backgroundColor = color;
    }

    fontFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const fontName = 'CustomFont_' + Date.now(); 
            const reader = new FileReader();
            reader.onload = function(event) {
                const fontUrl = event.target.result;
                const customFont = new FontFace(fontName, `url(${fontUrl})`);
                customFont.load().then(function(loadedFont) {
                    document.fonts.add(loadedFont);
                    activeFontName = fontName;
                    textPreview.style.fontFamily = fontName;
                    fontInfo.style.color = '#10b981';
                    fontInfo.textContent = `បានភ្ជាប់ពុម្ពអក្សរ៖ "${file.name}" រួចរាល់!`;
                }).catch(function(error) {
                    fontInfo.style.color = '#ef4444';
                    fontInfo.textContent = 'មិនអាចដំណើរការហ្វាយ Font នេះបានទេ!';
                });
            };
            reader.readAsDataURL(file);
        }
    });

    // 🚀 មុខងារពិសេស៖ ដោះស្រាយបញ្ហាគណនាប្លង់អក្សរខ្មែរ (Align Center/Right) នៅលើ iPad/iOS
    function drawTextToCanvas(callback) {
        document.fonts.ready.then(() => {
            const text = textPreview.innerText;
            const lines = text.split('\n');
            
            const currentFontSize = parseInt(fontSize.value);
            const currentLineHeight = parseFloat(lineSpacing.value);
            const currentTextColor = textColor.value;
            const currentBgColor = bgColor.value;

            // ១. បង្កើត Dummy Canvas ដើម្បីវាស់ទំហំអក្សរខ្មែរពិតប្រាកដ
            const dummyCanvas = document.createElement('canvas');
            const dummyCtx = dummyCanvas.getContext('2d');
            dummyCtx.font = `normal ${currentFontSize}px ${activeFontName}, 'Kantumruy Pro', sans-serif`;

            const lineMeasurements = lines.map(line => ({
                text: line,
                width: dummyCtx.measureText(line).width
            }));

            // ស្វែងរកជួរដែលវែងជាងគេដើម្បីកំណត់ទទឹង Canvas
            let maxLineWidth = 0;
            lineMeasurements.forEach(m => {
                if (m.width > maxLineWidth) { maxLineWidth = m.width; }
            });

            const paddingX = 40;
            const paddingY = 40;
            const baseWidth = Math.max(400, maxLineWidth + (paddingX * 2));
            const baseHeight = (lines.length * currentFontSize * currentLineHeight) + (paddingY * 2);
            const scale = 3; // បង្កើនកម្រិតច្បាស់ (Retina / High-DPI Display)

            const canvas = document.createElement('canvas');
            canvas.width = baseWidth * scale;
            canvas.height = baseHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);

            // ចាក់ពណ៌ផ្ទៃក្រោយរូបភាព
            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, baseWidth, baseHeight);

            ctx.textBaseline = "top";
            ctx.fillStyle = currentTextColor;
            ctx.font = `normal ${currentFontSize}px ${activeFontName}, 'Kantumruy Pro', sans-serif`;

            // 🌟 ដំណោះស្រាយដាច់ណាត់សម្រាប់ iPad៖ ប្រើប្រាស់គណិតវិទ្យាគណនាទីតាំង X ដោយផ្ទាល់ (ឈប់ប្រើ ctx.textAlign)
            ctx.textAlign = "left"; // បង្ខំឱ្យចាត់ទុកពីឆ្វេងដូចគ្នាទាំងអស់ ដើម្បីបង្ការ Bug របស់ Safari

            let startY = paddingY;
            lineMeasurements.forEach((m) => {
                let drawX = paddingX; // លំនាំដើមឆ្វេង (Left Alignment)

                if (currentAlign === "center") {
                    // កណ្តាល = (ទទឹងសរុប / ២) - (ប្រវែងអក្សរជួរនោះ / ២)
                    drawX = (baseWidth / 2) - (m.width / 2);
                } else if (currentAlign === "right") {
                    // ស្តាំ = ទទឹងសរុប - គម្លាតស្តាំ - ប្រវែងអក្សរជួរនោះ
                    drawX = baseWidth - paddingX - m.width;
                }

                ctx.fillText(m.text, drawX, startY);
                startY += (currentFontSize * currentLineHeight);
            });

            const pngUrl = canvas.toDataURL('image/png');
            callback(pngUrl, baseWidth, baseHeight);
        });
    }

    document.getElementById('saveImgBtn').addEventListener('click', () => {
        drawTextToCanvas((pngUrl) => {
            const link = document.createElement('a');
            link.download = 'toathmor-fixed-ipad.png';
            link.href = pngUrl;
            link.click();
        });
    });

    document.getElementById('savePdfBtn').addEventListener('click', () => {
        drawTextToCanvas((pngUrl, width, height) => {
            const { jsPDF } = window.jspdf;
            const orientation = width > height ? 'l' : 'p';
            const pdf = new jsPDF(orientation, 'px', [width, height]);
            pdf.addImage(pngUrl, 'PNG', 0, 0, width, height);
            pdf.save('toathmor-fixed-ipad.pdf');
        });
    });

    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            themeBtn.textContent = '🌙 Dark';
            setQuickColor('#1e293b', '#ffffff');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeBtn.textContent = '☀️ Light';
            setQuickColor('#f8fafc', '#1e293b');
        }
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'តារាងតេស្តពុម្ពអក្សរ - Toathmor',
                    text: 'ខ្ញុំកំពុងតេស្តពុម្ពអក្សរនៅលើកម្មវិធី Toathmor!',
                    url: window.location.href
                });
            } catch (err) { console.log('ការ Share ត្រូវបានបដិសេធ'); }
        } else {
            alert('Browser របស់អ្នកមិនទាន់គាំទ្រមុខងារ Share ផ្ទាល់ទេ!');
        }
    });
</script>
