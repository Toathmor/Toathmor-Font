<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>តារាងតេស្តពុម្ពអក្សរ - Font Tester Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Khmer+OS+Battambang&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkZvbnQgVGVzdGVyIFBybyIsCiAgInNob3J0X25hbWUiOiAiRm9udFRlc3RlciIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZjhmYWZjIiwKICAidGhlbWVfY29sb3IiOiAiIzRmNDZlNSIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImh0dHBzOi8vY2RuLWljb25zLXBuZy5mbGF0aWNvbi5jb20vNTEyLzI2NjUvMjY2NTExOS5wbmciLAogICAgICAic2l6ZXMiOiAiNTEyeDUxMiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIKICAgIH0KICBdCn0=">

    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --textarea-bg: #ffffff;
            --textarea-text: #0f172a;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: rgba(79, 70, 229, 0.08);
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.08);
            --success: #10b981;
            --success-light: rgba(16, 185, 129, 0.08);
            --toolbar-bg: #f8fafc;
            --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 12px -4px rgba(15, 23, 42, 0.04);
        }

        [data-theme="dark"] {
            --bg-body: #090d16;
            --bg-card: #131c2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #22314d;
            --textarea-bg: #131c2e;
            --textarea-text: #f8fafc;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: rgba(99, 102, 241, 0.12);
            --toolbar-bg: #1a263e;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box; /* 🔒 បង្ខំឱ្យគ្រប់ Element គណនាទំហំរួមទាំង Padding កុំឱ្យហៀរ */
        }

        body {
            font-family: 'Kantumruy Pro', 'Khmer OS Battambang', system-ui, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 10px; /* បន្ថយ Padding លើ Mobile កុំឱ្យប៉ោង */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, color 0.3s;
        }

        /* 🔄 ប្រអប់ធំ៖ រីករួមតាមទំហំអេក្រង់ (Fluid Width) */
        .container {
            width: 100%;
            max-width: 700px; /* កំណត់ទំហំសមល្មមស្អាតទាំងលើ Mobile និង Desktop */
            background: var(--bg-card);
            padding: 15px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .sub-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .theme-toggle, .pwa-btn {
            background: var(--primary-light);
            border: 1px solid transparent;
            padding: 6px 10px;
            border-radius: 50px;
            cursor: pointer;
            color: var(--primary);
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        
        .pwa-btn {
            background: var(--success-light);
            color: var(--success);
            display: none;
        }

        /* 🔒 ចាក់សោរប្រអប់រួម៖ ឱ្យនៅជាជួរដេក ២ ស្មើគ្នានិច្ច ទោះបីជាអេក្រង់តូចប៉ុណ្ណាក៏ដោយ */
        .combined-font-box {
            background: var(--toolbar-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* ចែកជា ២ ស្មើគ្នា ៥០% ម្នាក់ */
            gap: 10px;
            width: 100%;
        }

        .mini-upload-zone {
            border: 2px dashed var(--border-color);
            background: var(--bg-card);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            min-width: 0; /* ការពារកុំឱ្យហៀរ */
            overflow: hidden;
        }
        .mini-upload-zone span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* បើឈ្មោះវែងពេក វាដាក់ចំនុចៗ (...) ការពារកុំឱ្យរុញគ្នា */
        }
        .mini-upload-zone i { font-size: 13px; color: var(--primary); flex-shrink: 0; }

        .selector-zone {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .font-select-custom {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            font-family: inherit;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        #fontFile { display: none; }

        /* 🔄 របារបញ្ជាទាញ Size៖ ប្តូរទម្រង់ទៅតាមអេក្រង់ស្វ័យប្រវត្តិ */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* នៅលើ iPad/PC ចេញ ២ ជួរដេក */
            gap: 12px;
            margin-bottom: 15px;
            width: 100%;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .control-group label { 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--text-muted);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: var(--border-color);
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .color-pickers { display: flex; gap: 6px; flex: 1; min-width: 0; }
        .color-box { 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            font-size: 11px; 
            background: var(--toolbar-bg);
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            flex: 1;
            min-width: 0;
        }
        .color-box input[type="color"] {
            border: none; width: 18px; height: 18px; border-radius: 4px; cursor: pointer; background: none; padding: 0; flex-shrink: 0;
        }
        .color-box span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .palette-container { display: flex; gap: 4px; flex-wrap: wrap; }
        .palette-btn {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bg-card);
            cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.1); position: relative; overflow: hidden;
        }
        .palette-btn::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: var(--p-text); }
        .palette-btn::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: var(--p-bg); }

        .text-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; gap: 8px; width: 100%;
        }

        .sample-buttons { display: flex; gap: 4px; align-items: center; }
        .sample-buttons span { font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .sample-btn {
            background: var(--primary-light); color: var(--primary); border: 1px solid transparent;
            padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-family: inherit;
        }

        .clear-btn {
            background: var(--danger-light); color: var(--danger); border: 1px solid transparent;
            padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; font-family: inherit;
            display: flex; align-items: center; gap: 4px;
        }

        .preview-wrapper {
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .align-toolbar {
            display: flex; background: var(--toolbar-bg); padding: 6px; gap: 4px; border-bottom: 1px solid var(--border-color);
        }
        
        .align-btn {
            background: transparent; border: none; padding: 6px 10px; border-radius: 6px;
            cursor: pointer; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; font-family: inherit;
        }
        .align-btn.active { background: var(--primary); color: #ffffff; font-weight: 600; }

        .editable-preview {
            width: 100%;
            min-height: 150px;
            height: auto;
            padding: 15px;
            font-size: 24px;
            font-family: 'Kantumruy Pro', 'Khmer OS Battambang', sans-serif;
            color: var(--text-main);
            background: var(--bg-card);
            border: none;
            outline: none;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
        }
        .editable-preview:empty:before {
            content: attr(placeholder); color: var(--text-muted); opacity: 0.6; pointer-events: none;
        }

        /* 🔄 ប៊ូតុងសកម្មភាព៖ នៅលើ PC រីកទទឹងស្មើគ្នាដេក នៅលើ Mobile ប្តូរទៅតាមអេក្រង់ */
        .action-bar { display: flex; gap: 8px; width: 100%; }
        .action-btn {
            flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;
            cursor: pointer; font-weight: 600; font-family: inherit; font-size: 12px; display: flex;
            align-items: center; justify-content: center; gap: 4px;
            background: var(--bg-card); color: var(--text-main);
            white-space: nowrap;
        }
        .action-btn.primary { background: var(--primary); color: white; border-color: transparent; }

        /* 📱 ដំណោះស្រាយពិសេសសំរាប់ទូរស័ព្ទដៃអេក្រង់តូច (Mobile Responsive) */
        @media (max-width: 500px) {
            .controls-grid {
                grid-template-columns: 1fr; /* ប្តូរមកជាជួរឈរវិញដើម្បីកុំឱ្យហៀរការទាញ */
            }
            .control-group[style*="grid-column"] {
                grid-column: span 1 !important;
            }
            .control-group[style*="grid-column"] > div {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 8px;
            }
            .color-pickers {
                width: 100%;
            }
            .action-bar {
                flex-direction: column; /* ប៊ូតុងសកម្មភាពរៀបចុះក្រោមវិញដើម្បីងាយស្រួលចុចលើទូរស័ព្ទ */
            }
            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="title-area">
            <div class="brand-name">តារាងតេស្តពុម្ពអក្សរ</div>
            <div class="sub-title">Font Tester Pro</div>
        </div>
        <div class="header-actions">
            <button class="pwa-btn" id="installBtn"><i class="fa-solid fa-download"></i> ដំឡើង</button>
            <button class="theme-toggle" id="themeBtn"><i class="fa-solid fa-moon"></i> ងងឹត</button>
        </div>
    </div>
    
    <div class="combined-font-box">
        <div class="mini-upload-zone" onclick="document.getElementById('fontFile').click()">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>បញ្ចូលពុម្ពអក្សរ</span>
            <input type="file" id="fontFile" accept=".ttf, .otf, .woff, .woff2" multiple>
        </div>
        
        <div class="selector-zone">
            <select id="fontSelect" class="font-select-custom">
                <option value="default">ពុម្ពអក្សរប្រព័ន្ធ</option>
            </select>
        </div>
    </div>

    <div class="controls-grid">
        <div class="control-group">
            <div style="display: flex; justify-content: space-between;">
                <label>ទំហំអក្សរ</label>
                <span id="sizeVal" style="font-size:11px; font-weight:600; color:var(--primary);">32px</span>
            </div>
            <input type="range" id="fontSize" min="16" max="100" value="32">
        </div>
        <div class="control-group">
            <div style="display: flex; justify-content: space-between;">
                <label>គម្លាតបន្ទាត់</label>
                <span id="lineVal" style="font-size:11px; font-weight:600; color:var(--primary);">1.7</span>
            </div>
            <input type="range" id="lineSpacing" min="1" max="3" step="0.1" value="1.7">
        </div>
        <div class="control-group" style="grid-column: span 2;">
            <label>កំណត់ពណ៌ផ្ទាល់ខ្លួន / ពណ៌រហ័ស</label>
            <div style="display: flex; gap:10px; flex-wrap: wrap; align-items: center; justify-content: space-between; width: 100%;">
                <div class="color-pickers">
                    <div class="color-box"><input type="color" id="textColor" value="#0f172a"> <span>អក្សរ</span></div>
                    <div class="color-box"><input type="color" id="bgColor" value="#ffffff"> <span>ផ្ទៃក្រោយ</span></div>
                </div>
                <div class="palette-container">
                    <div class="palette-btn" style="--p-text: #0f172a; --p-bg: #ffffff;" onclick="setQuickColor('#0f172a', '#ffffff')"></div>
                    <div class="palette-btn" style="--p-text: #ffffff; --p-bg: #0f172a;" onclick="setQuickColor('#ffffff', '#0f172a')"></div>
                    <div class="palette-btn" style="--p-text: #facc15; --p-bg: #1e3a8a;" onclick="setQuickColor('#facc15', '#1e3a8a')"></div>
                    <div class="palette-btn" style="--p-text: #ffffff; --p-bg: #15803d;" onclick="setQuickColor('#ffffff', '#15803d')"></div>
                    <div class="palette-btn" style="--p-text: #ffffff; --p-bg: #b91c1c;" onclick="setQuickColor('#ffffff', '#b91c1c')"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-actions">
        <div class="sample-buttons">
            <span>គំរូ៖</span>
            <button class="sample-btn" onclick="insertSample('abc')">អក្សរ</button>
            <button class="sample-btn" onclick="insertSample('proverb')">សុភាសិត</button>
            <button class="sample-btn" onclick="insertSample('poem')">កំណាព្យ</button>
        </div>
        <button class="clear-btn" id="clearBtn"><i class="fa-regular fa-trash-can"></i> លុប</button>
    </div>

    <div class="preview-wrapper">
        <div class="align-toolbar">
            <button class="align-btn active" id="alignLeft" onclick="setTextAlign('left')">
                <i class="fa-solid fa-align-left"></i> ឆ្វេង
            </button>
            <button class="align-btn" id="alignCenter" onclick="setTextAlign('center')">
                <i class="fa-solid fa-align-center"></i> កណ្តាល
            </button>
            <button class="align-btn" id="alignRight" onclick="setTextAlign('right')">
                <i class="fa-solid fa-align-right"></i> ស្តាំ
            </button>
        </div>
        <div class="editable-preview" id="textPreview" contenteditable="true" placeholder="សូមវាយអក្សរខ្មែរនៅទីនេះ...">អនិច្ចាតោថ្មលោកកសាង
មើលថាថាងយ៉ាងរស់ស្ទុះប្រែប្រាយ
ឥឡូវមកធ្លាយធ្លាក់បាក់ខ្ចាត់ខ្ចាយ
ស្តាយអើយស្តាយមិនគួរមកពិការ។</div>
    </div>

    <div class="action-bar">
        <button class="action-btn primary" id="saveImgBtn"><i class="fa-regular fa-image"></i> រក្សាទុករូបភាព</button>
        <button class="action-btn" id="savePdfBtn"><i class="fa-regular fa-file-pdf"></i> PDF</button>
        <button class="action-btn" id="shareBtn"><i class="fa-solid fa-share-nodes"></i> ចែករំលែក</button>
    </div>
</div>

<script>
    const fontFileInput = document.getElementById('fontFile');
    const fontSelect = document.getElementById('fontSelect');
    const textPreview = document.getElementById('textPreview');
    const clearBtn = document.getElementById('clearBtn');
    
    const fontSize = document.getElementById('fontSize');
    const lineSpacing = document.getElementById('lineSpacing');
    const textColor = document.getElementById('textColor');
    const bgColor = document.getElementById('bgColor');

    const sizeVal = document.getElementById('sizeVal');
    const lineVal = document.getElementById('lineVal');

    const defaultFontStack = "'Kantumruy Pro', 'Khmer OS Battambang', sans-serif";
    let activeFontName = defaultFontStack;
    let currentAlign = "left";

    const samples = {
        abc: "ក្ក ខ្ខ គ្គ ឃ្ឃ ង្ង ច្ច ឆ្ឆ ជ្ជ ឈ្ឈ ញ្ញ ដ្ដ ឋ្ឋ ឌ្ឌ ឍ្ឍ ណ្ណ ត្ត ថ្ថ ទ្ទ ធ្ធ ប្ប ផ្ផ ព្ព ភ្ភ ម្ម យ្យ រ្រ ល្ល វ្វ ស្ស ហ្ហ ឡ អ្អ",
        proverb: "នគរថ្កើងប្លែក សប្បាយតែភ្នែក ក្នុងចិត្តរងកម្ម។\nវិជ្ជាជាទ្រព្យគាប់ចិន្តា។",
        poem: "អនិច្ចាតោថ្មលោកកសាង\nមើលថាថាងយ៉ាងរស់ស្ទុះប្រែប្រាយ\nឥឡូវមកធ្លាយធ្លាក់បាក់ខ្ចាត់ខ្ចាយ\nស្តាយអើយស្តាយមិនគួរមកពិការ"
    };

    function insertSample(type) { textPreview.innerText = samples[type]; }
    
    clearBtn.addEventListener('click', () => { textPreview.innerHTML = ''; textPreview.focus(); });

    function setTextAlign(alignType) {
        currentAlign = alignType;
        textPreview.style.textAlign = alignType;
        document.querySelectorAll('.align-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`align${alignType.charAt(0).toUpperCase() + alignType.slice(1)}`).classList.add('active');
    }

    textPreview.addEventListener('paste', function(e) {
        e.preventDefault();
        const text = (e.originalEvent || e).clipboardData.getData('text/plain');
        document.execCommand('insertText', false, text);
    });

    fontSize.addEventListener('input', (e) => { textPreview.style.fontSize = e.target.value + 'px'; sizeVal.textContent = e.target.value + 'px'; });
    lineSpacing.addEventListener('input', (e) => { textPreview.style.lineHeight = e.target.value; lineVal.textContent = e.target.value; });
    textColor.addEventListener('input', (e) => { textPreview.style.color = e.target.value; });
    bgColor.addEventListener('input', (e) => { updateBackground(e.target.value); });

    function setQuickColor(txtColor, backColor) {
        textColor.value = txtColor; bgColor.value = backColor;
        textPreview.style.color = txtColor; updateBackground(backColor);
    }
    function updateBackground(color) { textPreview.style.backgroundColor = color; }

    fontFileInput.addEventListener('change', function(e) {
        const files = e.target.files;
        if (files.length > 0) {
            Array.from(files).forEach(file => {
                const fontName = 'Custom_' + file.name.replace(/\.[^/.]+$/, "").replace(/[^a-zA-Z0-9]/g, "_") + '_' + Date.now();
                const reader = new FileReader();
                reader.onload = function(event) {
                    const fontUrl = event.target.result;
                    const customFont = new FontFace(fontName, `url(${fontUrl})`);
                    customFont.load().then(function(loadedFont) {
                        document.fonts.add(loadedFont);
                        const option = document.createElement('option');
                        option.value = fontName; option.textContent = file.name;
                        fontSelect.appendChild(option);
                        fontSelect.value = fontName;
                        triggerFontChange(fontName);
                    });
                };
                reader.readAsDataURL(file);
            });
        }
    });

    fontSelect.addEventListener('change', function(e) {
        triggerFontChange(e.target.value === 'default' ? defaultFontStack : e.target.value);
    });
    function triggerFontChange(fontName) { activeFontName = fontName; textPreview.style.fontFamily = fontName; }

    function drawTextToCanvas(callback) {
        document.fonts.ready.then(() => {
            const text = textPreview.innerText || textPreview.textContent;
            const lines = text.split('\n');
            const currentFontSize = parseInt(fontSize.value);
            const currentLineHeight = parseFloat(lineSpacing.value);
            const currentTextColor = textColor.value;
            const currentBgColor = bgColor.value;

            const dummyCanvas = document.createElement('canvas');
            const dummyCtx = dummyCanvas.getContext('2d');
            dummyCtx.font = `normal ${currentFontSize}px ${activeFontName}, sans-serif`;

            const lineMeasurements = lines.map(line => ({ text: line, width: dummyCtx.measureText(line).width }));
            let maxLineWidth = 0;
            lineMeasurements.forEach(m => { if (m.width > maxLineWidth) maxLineWidth = m.width; });

            const paddingX = 40; const paddingY = 40;
            const baseWidth = Math.max(400, maxLineWidth + (paddingX * 2));
            const baseHeight = (lines.length * currentFontSize * currentLineHeight) + (paddingY * 2);
            const scale = 3;

            const canvas = document.createElement('canvas');
            canvas.width = baseWidth * scale; canvas.height = baseHeight * scale;
            const ctx = canvas.getContext('2d'); ctx.scale(scale, scale);

            ctx.fillStyle = currentBgColor; ctx.fillRect(0, 0, baseWidth, baseHeight);
            ctx.textBaseline = "top"; ctx.fillStyle = currentTextColor;
            ctx.font = `normal ${currentFontSize}px ${activeFontName}, sans-serif`;

            let startY = paddingY;
            lineMeasurements.forEach((m) => {
                let drawX = paddingX;
                if (currentAlign === "center") drawX = (baseWidth / 2) - (m.width / 2);
                else if (currentAlign === "right") drawX = baseWidth - paddingX - m.width;
                ctx.fillText(m.text, drawX, startY);
                startY += (currentFontSize * currentLineHeight);
            });
            callback(canvas.toDataURL('image/png'), baseWidth, baseHeight);
        });
    }

    document.getElementById('saveImgBtn').addEventListener('click', () => {
        drawTextToCanvas((pngUrl) => {
            const link = document.createElement('a'); link.download = 'font-tester.png'; link.href = pngUrl; link.click();
        });
    });

    document.getElementById('savePdfBtn').addEventListener('click', () => {
        drawTextToCanvas((pngUrl, width, height) => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF(width > height ? 'l' : 'p', 'px', [width, height]);
            pdf.addImage(pngUrl, 'PNG', 0, 0, width, height); pdf.save('font-tester.pdf');
        });
    });

    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
        if (document.documentElement.getAttribute('data-theme') === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i> ងងឹត'; setQuickColor('#0f172a', '#ffffff');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i> ភ្លឺ'; setQuickColor('#f8fafc', '#131c2e');
        }
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
        drawTextToCanvas(async (pngUrl) => {
            if (navigator.share) {
                const response = await fetch(pngUrl); const blob = await response.blob();
                const file = new File([blob], 'font-test.png', { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'Font Tester' });
                }
            } else { alert('មិនទាន់គាំទ្រមុខងារ Share ទេ'); }
        });
    });

    let deferredPrompt; const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'flex'; });
    installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; installBtn.style.display = 'none'; } });
</script>
